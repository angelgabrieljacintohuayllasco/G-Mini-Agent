name: release

# Publica el instalador de Windows y el AppImage de Linux al subir un tag vX.Y.Z.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag existente a publicar (por ejemplo v0.2.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows, os: windows-latest, script: "dist:win", files: "electron/dist/*.exe" }
          - { name: linux, os: ubuntu-latest, script: "dist:linux", files: "electron/dist/*.AppImage\nelectron/dist/*.deb\nelectron/dist/*.rpm" }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - name: rpmbuild para el paquete .rpm
        if: matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Dependencias de la interfaz
        working-directory: electron
        run: npm ci

      - name: Empaquetar
        working-directory: electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run ${{ matrix.script }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true

      - name: Crear o actualizar el release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          ls -la out
          notes="docs/releases/${TAG}.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
          elif [ -f "$notes" ]; then
            gh release create "$TAG" out/* --title "G-Mini Agent ${TAG#v}" --notes-file "$notes"
          else
            gh release create "$TAG" out/* --title "G-Mini Agent ${TAG#v}" --generate-notes
          fi

# ============================================================
# G-Mini Agent — Catálogo centralizado de modelos
# Fuente única de verdad para el frontend y backend.
# Edita este archivo para agregar/quitar modelos sin tocar código.
#
# IDs verificados el 2026-10-07: Vertex AI (listado real del proyecto),
# documentación oficial de OpenAI, Anthropic, xAI, DeepSeek, Mistral y Groq,
# y el catálogo público de OpenRouter. Los proveedores compatibles con OpenAI
# además pueden listar sus modelos en vivo (GET /api/providers/{id}/models).
# ============================================================

# ── Etiquetas de proveedores para la UI ──
provider_labels:
  openai: "OpenAI"
  anthropic: "Anthropic (Claude)"
  google: "Google AI Studio"
  vertex: "Google Vertex AI"
  xai: "xAI (Grok)"
  deepseek: "DeepSeek"
  groq: "Groq"
  mistral: "Mistral AI"
  perplexity: "Perplexity"
  openrouter: "OpenRouter"
  cohere: "Cohere"
  moonshot: "Moonshot (Kimi)"
  dashscope: "Alibaba Qwen"
  zai: "Z.ai (GLM)"
  minimax: "MiniMax"
  cerebras: "Cerebras"
  sambanova: "SambaNova"
  venice: "Venice AI"
  together: "Together AI"
  fireworks: "Fireworks AI"
  deepinfra: "DeepInfra"
  nvidia: "NVIDIA NIM"
  huggingface: "Hugging Face"
  github: "GitHub Models"
  azure_openai: "Azure OpenAI"
  ollama: "Ollama (local)"
  lmstudio: "LM Studio (local)"
  custom: "Servidor propio"

# Proveedores que no usan API key (credenciales de Google Cloud o servidor local).
keyless_providers: ["vertex", "ollama", "lmstudio"]

# ── Modelos LLM / chat por proveedor ──
llm:
  openai:
    - "gpt-6.1-sol"          # Equilibrio inteligencia/costo (recomendado)
    - "gpt-6-astra"          # El más capaz: razonamiento y código complejo
    - "gpt-6-luna"           # El más eficiente para alto volumen
    - "gpt-4.1"              # Sin razonamiento, rápido
  anthropic:
    - "claude-opus-5-5"      # Agentes y código de larga duración
    - "claude-sonnet-5-5"    # Mejor balance velocidad/inteligencia
    - "claude-fable-5-1"     # Razonamiento más exigente (más caro)
    - "claude-haiku-4-5"     # El más rápido
  google: &gemini_models
    gemini-3.8-flash:
      display_name: "Gemini 3.8 Flash"
      version_type: "stable"
      inputs: ["text", "image", "video", "audio", "pdf"]
      outputs: ["text"]
      input_tokens: 1048576
      output_tokens: 65536
      features: {live_api: false, function_calling: true, thinking: true, structured_output: true, grounding_search: true, computer_use: true}
    gemini-3.1-pro-preview:
      display_name: "Gemini 3.1 Pro (preview)"
      version_type: "preview"
      inputs: ["text", "image", "video", "audio", "pdf"]
      outputs: ["text"]
      input_tokens: 1048576
      output_tokens: 65536
      features: {live_api: false, function_calling: true, thinking: true, structured_output: true, grounding_search: true, computer_use: true}
    gemini-3.7-flash:
      display_name: "Gemini 3.7 Flash"
      version_type: "stable"
      inputs: ["text", "image", "video", "audio", "pdf"]
      outputs: ["text"]
      input_tokens: 1048576
      output_tokens: 65536
      features: {live_api: false, function_calling: true, thinking: true, structured_output: true, grounding_search: true}
    gemini-3.5-flash:
      display_name: "Gemini 3.5 Flash"
      version_type: "stable"
      inputs: ["text", "image", "video", "audio", "pdf"]
      outputs: ["text"]
      input_tokens: 1048576
      output_tokens: 65536
      features: {live_api: false, function_calling: true, thinking: true, structured_output: true, grounding_search: true}
    gemini-3.5-flash-lite:
      display_name: "Gemini 3.5 Flash-Lite"
      version_type: "stable"
      inputs: ["text", "image", "video", "audio", "pdf"]
      outputs: ["text"]
      input_tokens: 1048576
      output_tokens: 65536
      features: {live_api: false, function_calling: true, thinking: true, structured_output: true}
    gemini-3.1-flash-lite:
      display_name: "Gemini 3.1 Flash-Lite"
      version_type: "stable"
      inputs: ["text", "image", "video", "audio", "pdf"]
      outputs: ["text"]
      input_tokens: 1048576
      output_tokens: 65536
      features: {live_api: false, function_calling: true, thinking: true, structured_output: true}
    gemini-2.5-pro:
      display_name: "Gemini 2.5 Pro"
      version_type: "stable"
      inputs: ["text", "image", "video", "audio", "pdf"]
      outputs: ["text"]
      input_tokens: 1048576
      output_tokens: 65536
      features: {live_api: false, function_calling: true, thinking: true, structured_output: true}
    gemini-2.5-flash:
      display_name: "Gemini 2.5 Flash"
      version_type: "stable"
      inputs: ["text", "image", "video", "audio", "pdf"]
      outputs: ["text"]
      input_tokens: 1048576
      output_tokens: 65536
      features: {live_api: false, function_calling: true, thinking: true, structured_output: true}
    gemini-2.5-computer-use-preview-10-2025:
      display_name: "Gemini 2.5 Computer Use (preview)"
      version_type: "preview"
      inputs: ["text", "image"]
      outputs: ["text"]
      input_tokens: 131072
      output_tokens: 65536
      features: {live_api: false, function_calling: true, computer_use: true}

    # ── Live API: audio/video en tiempo real (solo live.connect) ──
    gemini-3.8-live:
      display_name: "Gemini 3.8 Live"
      version_type: "stable"
      api_method: "live"
      output_constraint: "audio_primary"
      inputs: ["text", "image", "audio", "video"]
      outputs: ["text", "audio"]
      input_tokens: 131072
      output_tokens: 65536
      features: {live_api: true, function_calling: true, audio_generation: true, thinking: true}
    gemini-live-2.5-flash-native-audio:
      display_name: "Gemini 2.5 Flash Live (audio nativo, Vertex)"
      version_type: "stable"
      api_method: "live"
      output_constraint: "audio_primary"
      inputs: ["text", "audio", "video"]
      outputs: ["text", "audio"]
      input_tokens: 131072
      output_tokens: 8192
      features: {live_api: true, function_calling: true, audio_generation: true}
    gemini-2.5-flash-native-audio-preview-12-2025:
      display_name: "Gemini 2.5 Flash Live (audio nativo, AI Studio)"
      version_type: "preview"
      api_method: "live"
      output_constraint: "audio_primary"
      inputs: ["text", "audio", "video"]
      outputs: ["text", "audio"]
      input_tokens: 131072
      output_tokens: 8192
      features: {live_api: true, function_calling: true, audio_generation: true}
  vertex: *gemini_models
  xai:
    - "grok-4.7"
    - "grok-4.6"
    - "grok-4.3"
    - "grok-4.20-0309-non-reasoning"
  deepseek:
    - "deepseek-flash"        # V4.1 Flash, 1M de contexto
    - "deepseek-v4-pro"
  groq:
    - "openai/gpt-oss-120b"
    - "openai/gpt-oss-20b"
    - "llama-3.3-70b-versatile"
    - "llama-3.1-8b-instant"
  mistral:
    - "mistral-large-latest"
    - "mistral-medium-latest"
    - "mistral-small-latest"
    - "codestral-25-08"
  perplexity:
    - "sonar-pro"
    - "sonar"
    - "sonar-reasoning-pro"
  openrouter:
    - "openrouter/auto"
    - "anthropic/claude-sonnet-5.5"
    - "google/gemini-3.8-flash"
    - "openai/gpt-6.1-sol"
    - "x-ai/grok-4.7"
    - "moonshotai/kimi-k3"
  cohere:
    - "command-a-03-2025"
    - "command-r-plus"
    - "command-r"
  moonshot:
    - "kimi-k3"
  dashscope:
    - "qwen-max"
    - "qwen-plus"
    - "qwen-flash"
  zai:
    - "glm-5.3"
    - "glm-5.3-flash"
  minimax: []
  cerebras: []
  sambanova: []
  venice: []
  together: []
  fireworks: []
  deepinfra: []
  nvidia: []
  huggingface:
    - "openai/gpt-oss-120b"
  github:
    - "openai/gpt-4.1"
    - "openai/gpt-4.1-mini"
  azure_openai: []
  ollama: []
  lmstudio: []
  custom: []

# ── Modelos de generación de imágenes (Google) ──
image:
  - "gemini-3.1-flash-image"
  - "gemini-3-pro-image"
  - "gemini-3.1-flash-image-preview"
  - "gemini-2.5-flash-image"
  - "imagen-4.0-ultra-generate-001"
  - "imagen-4.0-generate-001"
  - "imagen-4.0-fast-generate-001"

# ── Modelos de generación de video (Google) ──
video:
  - "veo-3.1-generate-001"
  - "veo-3.1-fast-generate-001"
  - "veo-3.1-lite-generate-001"
  - "veo-3.0-generate-001"
  - "veo-3.0-fast-generate-001"
  - "veo-2.0-generate-001"

# ── Modelos de generación de música (Google) ──
music:
  - "lyria-3-pro-preview"
  - "lyria-3-clip-preview"
  - "lyria-002"

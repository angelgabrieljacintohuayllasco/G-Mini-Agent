<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>G-Mini Avatar</title>
    <script src="js/theme-boot.js"></script>
    <link rel="stylesheet" href="css/tokens.css">
    <style>
        /* Ventana transparente: sin lienzo oscuro por color-scheme. */
        :root,
        :root[data-theme] {
            color-scheme: normal !important;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html,
        body {
            width: 100%;
            height: 100%;
            background: transparent;
            overflow: hidden;
            font-family: var(--font);
            user-select: none;
            -webkit-app-region: no-drag;
        }

        #skin-canvas {
            position: fixed;
            inset: 0;
            display: block;
            width: 100%;
            height: 100%;
        }

        #skin-controls {
            position: fixed;
            top: var(--space-2);
            right: var(--space-2);
            z-index: 10;
            display: flex;
            gap: 2px;
            padding: 3px;
            border: 1px solid color-mix(in srgb, var(--border-strong) 70%, transparent);
            border-radius: var(--radius-pill);
            background: color-mix(in srgb, var(--bg-elevated) 72%, transparent);
            backdrop-filter: blur(8px);
            opacity: 0;
            transform: translateY(-4px);
            pointer-events: none;
            transition: opacity var(--dur) var(--ease-out), transform var(--dur) var(--ease-out);
        }

        #skin-controls.visible {
            opacity: 1;
            transform: none;
            pointer-events: auto;
        }

        .skin-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 26px;
            height: 26px;
            border: 0;
            border-radius: 50%;
            background: transparent;
            color: var(--text-primary);
            cursor: pointer;
            transition: background-color var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out);
        }

        .skin-btn:hover {
            background: var(--bg-hover);
        }

        .skin-btn .icon {
            width: 14px;
            height: 14px;
        }

        #btn-skin-close:hover,
        .skin-btn.skin-mic-active {
            background: var(--error);
            color: #ffffff;
        }

        .skin-btn.skin-mic-hidden {
            display: none;
        }

        /* ── Mini-chat burbuja ── */
        #skin-chat {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            z-index: 20;
            display: none;
            flex-direction: column;
            width: 300px;
            border-left: 1px solid var(--border);
            background: color-mix(in srgb, var(--bg-primary) 86%, transparent);
            backdrop-filter: blur(14px);
            color: var(--text-primary);
        }

        #skin-chat.visible {
            display: flex;
        }

        #skin-chat-messages {
            display: flex;
            flex: 1;
            flex-direction: column;
            gap: var(--space-2);
            overflow-y: auto;
            padding: var(--space-3);
        }

        .skin-chat-msg {
            max-width: 90%;
            padding: 6px var(--space-3);
            border-radius: var(--radius-lg);
            font-size: var(--fs-sm);
            line-height: 1.45;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .skin-chat-msg-user {
            align-self: flex-end;
            border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--border));
            background: color-mix(in srgb, var(--accent) 22%, var(--bg-surface));
        }

        .skin-chat-msg-agent {
            align-self: flex-start;
            border: 1px solid var(--border);
            background: var(--bg-surface);
        }

        .skin-chat-msg-system {
            align-self: center;
            background: transparent;
            color: var(--text-muted);
            font-size: var(--fs-xs);
            text-align: center;
        }

        #skin-chat-form {
            display: flex;
            gap: var(--space-2);
            padding: var(--space-2);
            border-top: 1px solid var(--border);
        }

        #skin-chat-input {
            flex: 1;
            min-width: 0;
            height: 32px;
            padding: 0 var(--space-3);
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-sm);
            background: var(--bg-input);
            color: var(--text-primary);
            font: inherit;
            font-size: var(--fs-sm);
            outline: none;
        }

        #skin-chat-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }

        #skin-chat-form button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border: 0;
            border-radius: var(--radius-sm);
            background: var(--accent);
            color: var(--text-on-accent);
            cursor: pointer;
        }

        #skin-chat-form button:hover {
            background: var(--accent-hover);
        }

        #skin-chat-form button .icon {
            width: 16px;
            height: 16px;
        }
    </style>
</head>
<body>
    <canvas id="skin-canvas"></canvas>
    <div id="skin-controls">
        <button id="btn-skin-mic" class="skin-btn skin-mic-hidden" type="button" title="Voz en tiempo real" aria-label="Activar voz en tiempo real">
            <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#i-mic"></use></svg>
        </button>
        <button id="btn-skin-minimize" class="skin-btn" type="button" title="Minimizar" aria-label="Minimizar">
            <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#i-minus"></use></svg>
        </button>
        <button id="btn-skin-close" class="skin-btn" type="button" title="Cerrar avatar" aria-label="Cerrar avatar">
            <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#i-x"></use></svg>
        </button>
    </div>
    <div id="skin-chat" role="dialog" aria-label="Chat rápido">
        <div id="skin-chat-messages" role="log"></div>
        <form id="skin-chat-form">
            <input id="skin-chat-input" type="text" placeholder="Escribe un mensaje..." autocomplete="off" aria-label="Mensaje">
            <button type="submit" title="Enviar" aria-label="Enviar">
                <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#i-arrow-up"></use></svg>
            </button>
        </form>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "./vendor/three/three.module.js",
            "three/addons/": "./vendor/three/jsm/",
            "@pixiv/three-vrm": "./vendor/three-vrm/three-vrm.module.js"
        }
    }
    </script>
    <script type="module" src="./js/skins/skinRuntime.js"></script>
</body>
</html>

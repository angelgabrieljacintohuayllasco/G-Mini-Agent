<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>G-Mini Overlay</title>
    <script src="js/theme-boot.js"></script>
    <link rel="stylesheet" href="css/tokens.css">
    <style>
        /* Ventana transparente: sin lienzo oscuro por color-scheme. */
        :root,
        :root[data-theme] {
            color-scheme: normal !important;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html,
        body {
            background: transparent;
            overflow: hidden;
            font-family: var(--font);
            user-select: none;
            -webkit-app-region: no-drag;
        }

        #overlay-content {
            position: fixed;
            right: var(--space-5);
            bottom: var(--space-5);
            display: flex;
            align-items: flex-start;
            gap: var(--space-2);
            max-width: 360px;
            max-height: 260px;
            overflow-y: auto;
            padding: var(--space-3) var(--space-4);
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-lg);
            background: color-mix(in srgb, var(--bg-elevated) 88%, transparent);
            backdrop-filter: blur(14px);
            color: var(--text-primary);
            font-size: var(--fs-base);
            line-height: var(--lh-base);
            box-shadow: var(--shadow-lg);
        }

        .status-dot {
            flex: 0 0 auto;
            width: 8px;
            height: 8px;
            margin-top: 7px;
            border-radius: 50%;
            background: var(--success);
            box-shadow: 0 0 0 3px var(--success-soft);
        }

        .status-dot.thinking {
            background: var(--warning);
            box-shadow: 0 0 0 3px var(--warning-soft);
            animation: pulse 1s var(--ease-in-out) infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.45; }
        }

        #overlay-text {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }
    </style>
</head>
<body>
    <div id="overlay-content" role="status" aria-live="polite">
        <span id="status-dot" class="status-dot" aria-hidden="true"></span>
        <span id="overlay-text">G-Mini Agent listo</span>
    </div>

    <script src="js/overlay.js"></script>
</body>
</html>
